name: release

run-name: "release ${{ inputs.bump && format('(bump {0})', inputs.bump) || github.ref_name }}"

# 触发方式：
#   1. push tag v1.2.3        → 按该 tag 发布（手动指定版本）
#   2. workflow_dispatch      → 自动把最新 tag 的版本号 +1（patch 叠加，可选 major/minor）后发布
#
# 发布的是正式 release（prerelease=false, latest=true）。
# 产物矩阵：linux/amd64, linux/arm64, windows/amd64, windows/arm64（静态编译，无 CGO）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version component to bump for the new release"
        required: false
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  packages: write # 推送 GHCR 镜像需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BINARY: zen-gateway
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      notes: ${{ steps.ver.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整 tag 历史

      - id: ver
        name: Compute next version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail

          # push tag 触发：直接使用该 tag
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            {
              echo "version=${version}"
              echo "tag=${tag}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # workflow_dispatch 触发：取最新 tag，按 BUMP 叠加
          latest_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [[ -z "${latest_tag}" ]]; then
            latest_tag="v0.0.0"
            echo "no existing tag found, starting from v0.0.0"
          fi

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<<"${version}"
          case "${BUMP}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "invalid bump: ${BUMP}"; exit 1 ;;
          esac

          new_version="${major}.${minor}.${patch}"
          new_tag="v${new_version}"

          # 理论并发冲突保护：同 tag 已存在则再叠一版
          while git rev-parse -q --verify "refs/tags/${new_tag}" >/dev/null 2>&1; do
            patch=$((patch + 1))
            new_version="${major}.${minor}.${patch}"
            new_tag="v${new_version}"
          done

          {
            echo "version=${new_version}"
            echo "tag=${new_tag}"
            echo "notes=Automated release ${new_tag} (bumped ${BUMP} from ${latest_tag})"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "release ${TAG}"
          git push origin "${TAG}"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          # 兼容两种仓库布局：模块在仓库根，或在一个子目录内（自动探测含 go.mod 的目录）
          MODROOT="."
          if [[ ! -f go.mod ]]; then
            MODROOT="$(dirname "$(find . -maxdepth 3 -name go.mod | head -1)")"
          fi
          ext=""
          if [[ "${GOOS}" == "windows" ]]; then ext=".exe"; fi
          out="${RUNNER_TEMP}/${BINARY}-${GOOS}-${GOARCH}${ext}"
          (cd "${MODROOT}" && go build -trimpath -ldflags "-s -w" -o "${out}" ./cmd/gateway)
          # 生成 sha256 校验和文件，便于用户校验下载
          (cd "${RUNNER_TEMP}" && sha256sum "$(basename "${out}")" > "${out}.sha256")
          echo "artifact=${out}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ runner.temp }}/${{ env.BINARY }}-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NOTES: ${{ needs.version.outputs.notes }}
        run: |
          set -euo pipefail
          # 正式 release：无 --prerelease，--latest 置顶
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --notes "${NOTES:-Automated release ${TAG}}" \
            --latest \
            artifacts/*

  docker:
    name: Build & push GHCR image
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # 语义化标签：版本 tag 镜像 + latest（正式 release 才置顶 latest）
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.description=OpenCode Zen free-model relay gateway
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
